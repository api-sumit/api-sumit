# Generates metrics.svg (stats + languages, including private repos) for the profile README.
# Requires a classic PAT with the "repo" scope saved as the METRICS_TOKEN repository secret.
name: Metrics

on:
  schedule:
    - cron: "0 10 * * *" # daily, 6 AM Eastern
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: api-sumit
          filename: metrics.svg
          template: classic
          config_timezone: America/New_York
          # Aggregate sections only; no section here lists private repo names.
          base: header, activity, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
